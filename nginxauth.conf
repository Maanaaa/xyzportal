server {
    server_name xyz.theo-manya.fr;
    listen 80;
    listen [::]:80;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    server_name xyz.theo-manya.fr;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # SSL configuration (update paths as needed)
    ssl_certificate /etc/letsencrypt/live/xyz.theo-manya.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xyz.theo-manya.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nginx basic auth
    auth_basic "XYZ Portal";
    auth_basic_user_file /etc/nginx/.htpasswd-xyz;

    location / {
        proxy_pass http://xyz-portal:3000;
        proxy_http_version 1.1;
        
        # Pass auth header to container
        proxy_set_header Remote-User $remote_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache static assets
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        proxy_pass http://xyz-portal:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}