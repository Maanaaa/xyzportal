version: '3.8'

services:
  xyz-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xyz-portal
    ports:
      - "3020:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - xyz-network
    # Uncomment the line below if you're using this behind nginx with auth
    # labels:
    #   - "com.example.auth=true"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {if (r.statusCode !== 401 && r.statusCode !== 200) process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  xyz-network:
    driver: bridge
