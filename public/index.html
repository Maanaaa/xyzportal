<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ Portal</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-text">
                    <h1>XYZ Portal</h1>
                    <p class="subtitle">Your digital ecosystem</p>
                </div>
                <button id="open-modal-btn" class="btn btn-add">
                    <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Ajouter un site</span>
                </button>
            </div>
        </header>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading applications...</p>
        </div>

        <main id="apps-grid" class="apps-grid" style="display: none;">
            <!-- Apps will be inserted here -->
        </main>

        <footer>
            <p>Lightweight portal • Secure access • Fast load</p>
        </footer>
    </div>

    <!-- Modal pour ajouter un site -->
    <div id="add-modal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modal-title">Ajouter un site</h2>
                <button id="close-modal-btn" class="modal-close" aria-label="Fermer">&times;</button>
            </div>
            <form id="add-app-form">
                <input type="hidden" id="app-original-url">
                <div class="form-group">
                    <label for="app-name">Nom du site <span class="required">*</span></label>
                    <input type="text" id="app-name" placeholder="ex: Grafana" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="app-description">Service / Description</label>
                    <input type="text" id="app-description" placeholder="ex: Monitoring & Metrics" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="app-url">URL du site <span class="required">*</span></label>
                    <input type="url" id="app-url" placeholder="https://grafana.theo-manya.fr" required autocomplete="off">
                </div>

                <div id="modal-error" class="modal-error" style="display: none;"></div>

                <div class="modal-actions">
                    <button type="button" id="cancel-btn" class="btn btn-secondary">Annuler</button>
                    <button type="submit" id="submit-btn" class="btn btn-primary">
                        <span id="submit-text">Enregistrer</span>
                        <span id="submit-spinner" class="spinner-sm" style="display: none;"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
